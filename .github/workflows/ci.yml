name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20.19.0", "22.13.0", "24"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Configure Git Bash for command tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitSh = Get-Command sh.exe -ErrorAction SilentlyContinue
          if ($null -eq $gitSh) {
            throw "Git Bash sh.exe is required by the run_command tests on Windows."
          }
          Split-Path $gitSh.Source -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:only

      - name: Check registry manifest version sync
        run: node dist/registry/sync-manifest.js --check

      - name: Packed package CLI smoke test
        run: node scripts/packed-cli-smoke.mjs

      - name: Set up Bun (Linux Node 22)
        if: runner.os == 'Linux' && matrix.node == '22.13.0'
        uses: oven-sh/setup-bun@v2

      - name: Bunx smoke test (packed tarball)
        if: runner.os == 'Linux' && matrix.node == '22.13.0'
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          VERSION=$(node -p "require('./package.json').version")
          TMPDIR=$(mktemp -d) bun x --package "$RUNNER_TEMP/glm-acp-agent-$VERSION.tgz" glm-acp-agent < /dev/null
